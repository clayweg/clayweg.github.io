<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Graphical Firewall Interface</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Firewall Control Panel</h1>
  </header>

  <main>
    <section class="panel" id="rule-manager">
      <h2>Rule Manager</h2>
      <form id="rule-form">
        <div class="form-row">
          <label>Action:</label>
          <select id="action">
            <option>Allow</option>
            <option>Block</option>
          </select>
        </div>
        <div class="form-row">
          <label>Direction:</label>
          <select id="direction">
            <option>Incoming</option>
            <option>Outgoing</option>
          </select>
        </div>
        <div class="form-row">
          <label>Protocol:</label>
          <select id="protocol">
            <option>TCP</option>
            <option>UDP</option>
            <option>ICMP</option>
          </select>
        </div>
        <div class="form-row">
          <label>Port:</label>
          <input type="text" id="port" placeholder="e.g. 80 or 1000-2000">
        </div>
        <div class="form-row">
          <label>IP Address:</label>
          <input type="text" id="ip" placeholder="e.g. 192.168.0.1">
        </div>
        <button type="submit">Add Rule</button>
      </form>
    </section>

    
    <section class="panel" id="traffic-overview">
      <h2>Traffic Overview</h2>
      <canvas id="pieChart" height="150"></canvas>
      <canvas id="barChart" height="150"></canvas>
    </section>
    <section class="panel" id="activity-log">
      <h2>Activity Log</h2>
      <table>
        <thead>
          <tr>
            <th>Time</th>
            <th>IP</th>
            <th>Port</th>
            <th>Protocol</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="log-body">
        </tbody>
      </table>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js"></script>
</body>
</html>
